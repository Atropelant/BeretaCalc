<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BeretaCalc</title>
</head>
<body>
    <div class="container">
        <h1>BeretaCalc</h1>

        <div class="entrada">
            <div id="visor">0</div>
        </div>

        <div class="operadores">
            <input type="button" value="7" id="sete">
            <input type="button" value="8" id="oito">
            <input type="button" value="9" id="nove">
            <input type="button" value="/" id="divisao">

            <input type="button" value="4" id="quatro">
            <input type="button" value="5" id="cinco">
            <input type="button" value="6" id="seis">
            <input type="button" value="*" id="multiplicacao">

            <input type="button" value="1" id="um">
            <input type="button" value="2" id="dois">
            <input type="button" value="3" id="tres">
            <input type="button" value="-" id="subtracao">

            <input type="button" value="0" id="zero">
            <input type="button" value="C" id="limpar">
            <input type="button" value="=" id="enviar">
            <input type="button" value="+" id="soma">
        </div>

        <div id="result">Resultado aqui</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
